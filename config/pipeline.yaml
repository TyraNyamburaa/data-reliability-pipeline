warehouse_type: ${WAREHOUSE_TYPE:-postgres}
postgres:
  host: ${POSTGRES_HOST:-postgres}
  port: ${POSTGRES_PORT:-5432}
  database: ${POSTGRES_DB:-transaction_warehouse}
  user: ${POSTGRES_USER:-pipeline_user}
  password: ${POSTGRES_PASSWORD:-}
snowflake:
  account: ${SNOWFLAKE_ACCOUNT:-}
  user: ${SNOWFLAKE_USER:-}
  password: ${SNOWFLAKE_PASSWORD:-}
  database: ${SNOWFLAKE_DATABASE:-TRANSACTIONS}
  warehouse: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
  schema: ${SNOWFLAKE_SCHEMA:-RELIABILITY}
bigquery:
  project_id: ${BIGQUERY_PROJECT_ID:-}
  dataset: ${BIGQUERY_DATASET:-transaction_reliability}
  credentials_path: ${GOOGLE_APPLICATION_CREDENTIALS:-}
redshift:
  host: ${REDSHIFT_HOST:-}
  port: ${REDSHIFT_PORT:-5439}
  database: ${REDSHIFT_DATABASE:-dev}
  user: ${REDSHIFT_USER:-}
  password: ${REDSHIFT_PASSWORD:-}
