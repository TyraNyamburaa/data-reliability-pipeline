[project]
name = "data-reliability-pipeline"
version = "0.1.0"
description = "A data reliability pipeline for transaction data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pytest>=7.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
airflow = ["apache-airflow>=2.7"]
spark = ["pyspark>=3.5"]
streaming = ["confluent-kafka>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
